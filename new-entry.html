<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>new journal entry</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>new journal entry</h1>
    <p>the journal is entrying O.o</p>
    
    <form id="post-form">
        <textarea id="post-content"
            rows="8"
            cols="50"
            placeholder="write uh i dunno.. your eternal hopes and dreams. dont ask
            me i'm not very original."
            required
        ></textarea>
        <label>
            <input id="is-public" type="checkbox">
            show this entry on my public profile
        </label>
        <br><br>
        <button type="submit">post</button>
    </form>

    <p id="post-message"></p>
    <a href="index.html">go back home</a>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="new-post.js"></script>
</body>
</html>
